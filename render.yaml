services:
  - type: web
    name: dutylock
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- -p $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: QUOTE_SIGNING_SECRET
        generateValue: true
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: AI_CALLS_PER_HOUR
        value: "20"
